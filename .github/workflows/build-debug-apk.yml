name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode google-services.json
        run: |
          printf '%s' "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json

      - name: Diagnose google-services.json (no content/secret printed)
        run: |
          echo "Byte size:"
          wc -c < app/google-services.json
          echo "File type:"
          file app/google-services.json
          echo "SHA256:"
          sha256sum app/google-services.json
          echo "First/last byte (should be { and }):"
          head -c 1 app/google-services.json | xxd
          tail -c 1 app/google-services.json | xxd

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatty-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
